name: CI

# Syncs a curated subset of the voidlab release to the harbour binary repository.
# Harbour does not build from source: it filters voidlab's release to only the
# packages listed in tools/packages (and their subpackages), then signs and
# uploads them to the harbour `repo` release.
#
# Triggered daily (after voidlab's nightly run) and on any push that changes
# the approved package list.
on:
  push:
    branches: [master]
    paths:
      - tools/packages
      - tools/never-publish
      - .github/workflows/ci.yml
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tools
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Sy
          xbps-install -uy xbps
          xbps-install -Suy
          xbps-install -y bash github-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harbour

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mendescotta/voidlab
          path: voidlab

      - name: Pull voidlab release
        run: |
          mkdir -p voidlab-repo
          gh release download repo -R mendescotta/voidlab \
            -D voidlab-repo/ --pattern '*.xbps' --clobber
          xbps-rindex -a voidlab-repo/*.xbps >/dev/null

      - name: Filter to harbour-approved packages
        shell: bash
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE"

          # name_map_load resolves srcpkgs/ relative to cwd — run from the voidlab checkout
          cd "$W/voidlab"
          . tools/ci-lib.sh
          name_map_load
          cd "$W"

          mapfile -t approved < <(sed 's/#.*//' "$W/harbour/tools/packages" | grep -v '^[[:space:]]*$')
          mapfile -t never    < <(sed 's/#.*//' "$W/harbour/tools/never-publish" | grep -v '^[[:space:]]*$')

          mkdir -p "$W/harbour-repo"
          n=0
          while read -r pkgver; do
            name="${pkgver%-*}"
            template="${NAME_OWNER[$name]:-}"
            [ -n "$template" ] || continue
            printf '%s\n' "${approved[@]}" | grep -qxF "$template" || continue
            skip=0
            for nv in "${never[@]}"; do
              case "$name" in "$nv"|"$nv"-*) skip=1 ;; esac
            done
            [ "$skip" = 1 ] && continue
            for f in "$W/voidlab-repo/${pkgver}".*.xbps; do
              [ -f "$f" ] || continue
              ln "$f" "$W/harbour-repo/" 2>/dev/null || cp "$f" "$W/harbour-repo/"
              n=$((n + 1))
            done
          done < <(xbps-query --ignore-conf-repos --repository="$W/voidlab-repo" -R -s '' | awk '{print $2}')
          echo "harbour: $n packages selected"
          [ "$n" -gt 0 ] || { echo "!! no packages selected — check tools/packages"; exit 1; }

      - name: Sign and publish
        shell: bash
        env:
          VOIDLAB_PRIVKEY: ${{ secrets.VOIDLAB_PRIVKEY }}
          HARBOUR_GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE"
          printf '%s' "$VOIDLAB_PRIVKEY" > /tmp/harbour-key.pem
          chmod 600 /tmp/harbour-key.pem

          xbps-rindex -a "$W/harbour-repo/"*.xbps >/dev/null
          xbps-rindex --privkey /tmp/harbour-key.pem \
            --signedby "harbour <mendescotta>" --sign "$W/harbour-repo/" >/dev/null
          xbps-rindex --privkey /tmp/harbour-key.pem \
            --sign-pkg "$W/harbour-repo/"*.xbps >/dev/null

          gh release view repo -R "$HARBOUR_GH_REPO" >/dev/null 2>&1 || \
            gh release create repo -R "$HARBOUR_GH_REPO" --prerelease \
              --title "harbour repository" \
              --notes "xbps binary repository — Devoid package set"

          remote=$(gh release view repo -R "$HARBOUR_GH_REPO" \
            --json assets -q '.assets[] | "\(.name) \(.digest)"')

          up=()
          for f in "$W/harbour-repo/"*; do
            n=$(basename "$f")
            digest=$(sha256sum "$f" | awk '{print "sha256:"$1}')
            echo "$remote" | grep -qF "$n $digest" || up+=("$f")
          done
          echo "=> uploading ${#up[@]} of $(ls "$W/harbour-repo/" | wc -l) files"
          [ ${#up[@]} -eq 0 ] || \
            gh release upload repo -R "$HARBOUR_GH_REPO" --clobber "${up[@]}"

          for n in $(echo "$remote" | awk '{print $1}'); do
            [ -e "$W/harbour-repo/$n" ] || \
              gh release delete-asset repo "$n" -R "$HARBOUR_GH_REPO" -y
          done

          echo "repository: https://github.com/$HARBOUR_GH_REPO/releases/download/repo"
